name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: HeliosLauncher-master/HeliosLauncher-master

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HeliosLauncher-master/HeliosLauncher-master/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-launcher-exe
          path: HeliosLauncher-master/HeliosLauncher-master/dist/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HeliosLauncher-master/HeliosLauncher-master/dist/*.exe
